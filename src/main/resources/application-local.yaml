
app:
  datasource:
    customer:
      jdbc-url: jdbc:postgresql://localhost:5433/customer_db
      username: ${CUSTOMER_DB_USER}
      password: ${CUSTOMER_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    credit:
      jdbc-url: jdbc:postgresql://localhost:5434/credit_db
      username: ${CREDIT_DB_USER}
      password: ${CREDIT_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

spring:
  config:
    import: "file:./.env[.properties]"
  jpa:
    hibernate:
      ddl-auto: validate
